# =====================================================================
#  CD – Deploy auf den Server
#  Läuft automatisch, sobald der Workflow "Tests" auf main ERFOLGREICH
#  durchgelaufen ist (oder manuell über den Reiter "Actions").
#
#  Ablauf:
#    1. Docker-Image aus maschinenverleih/Dockerfile bauen
#    2. Image in die GitHub Container Registry (ghcr.io) hochladen
#    3. Per SSH auf den Server: neues Image holen und Container neu starten
#
#  Voraussetzungen (einmalig einzurichten):
#
#  GitHub → Repository → Settings → Secrets and variables → Actions:
#    SERVER_HOST     IP des Servers (217.154.119.131)
#    SERVER_USER     Benutzer für den Deploy (eigener Benutzer, Mitglied der Gruppe docker)
#    SERVER_SSH_KEY  privater SSH-Schlüssel dieses Benutzers (nur für den Deploy erzeugt,
#                    öffentlicher Teil liegt auf dem Server in ~/.ssh/authorized_keys)
#
#  Auf dem Server (Aufgabe SI):
#    - Ordner /opt/maschinenverleih/app mit compose.yaml für den App-Container
#      (Image ghcr.io/<owner>/maschinenverleih:latest, Port 8080, Datenbank-Zugang
#      über eine .env-Datei mit chmod 600 – niemals im Repository)
#    - App-Container im selben Docker-Netzwerk wie maschinenverleih-db,
#      DB_HOST = maschinenverleih-db, DB_PORT = 5432 ("localhost" geht im Container NICHT)
#    - Ist das Paket auf ghcr.io privat: einmalig "docker login ghcr.io" mit einem
#      Token, das nur "read:packages" darf
# =====================================================================
name: Deploy

on:
  workflow_run:
    workflows: ["Tests"]      # muss exakt dem "name:" in test.yml entsprechen
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Nie zwei Deploys gleichzeitig – ein laufender wird zu Ende gebracht
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Image-Name: ghcr.io/<github-name>/maschinenverleih (wird automatisch kleingeschrieben)
  IMAGE: ghcr.io/${{ github.repository_owner }}/maschinenverleih

jobs:
  build:
    name: Image bauen und hochladen
    runs-on: ubuntu-latest
    # Nur wenn die Tests grün waren (bei manuellem Start immer)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write         # erlaubt das Hochladen nach ghcr.io mit dem GITHUB_TOKEN

    steps:
      - name: Code auschecken (genau den getesteten Stand)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Bei ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # stellt GitHub automatisch bereit

      - name: Tags festlegen (latest + Commit-Kennung)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Image bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: ./maschinenverleih
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Auf dem Server ausrollen
    needs: build
    runs-on: ubuntu-latest
    environment: production   # in GitHub sichtbar; dort kann man optional eine Freigabe verlangen

    steps:
      - name: Per SSH neues Image holen und Container neu starten
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/maschinenverleih/app
            docker compose pull
            docker compose up -d
            docker image prune -f
            docker compose ps
