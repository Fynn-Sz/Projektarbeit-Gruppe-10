# Einstellungen nur fuer den Server (aktiv mit SPRING_PROFILES_ACTIVE=prod)
# Alles, was hier nicht steht, kommt weiter aus application.properties.

# Kein schema.sql / data.sql beim Start:
# - der App-Benutzer darf keine Tabellen anlegen (nur lesen/schreiben)
# - keine Demo-Daten auf dem Server
spring.sql.init.mode=never

# Keine SQL-Befehle im Server-Log
spring.jpa.show-sql=false

# Hinter dem spaeteren HTTPS-Webserver: Weiterleitungen zeigen auf https://
server.forward-headers-strategy=framework
