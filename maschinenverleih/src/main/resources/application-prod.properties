# Einstellungen nur fuer den Server (aktiv mit SPRING_PROFILES_ACTIVE=prod)
# Alles, was hier nicht steht, kommt weiter aus application.properties.
# (Dass die Anwendung keine Tabellen anlegt, gilt bereits ueberall - siehe application.properties.)

# Keine SQL-Befehle im Server-Log
spring.jpa.show-sql=false

# Hinter dem HTTPS-Webserver (nginx): Weiterleitungen zeigen auf https://
server.forward-headers-strategy=framework
