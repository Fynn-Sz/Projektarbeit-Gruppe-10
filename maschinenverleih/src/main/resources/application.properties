spring.application.name=maschinenverleih
server.port=8080

# --- Datenbank: PostgreSQL ---
# Zugangsdaten kommen aus Umgebungsvariablen - niemals Passwoerter ins Repository schreiben!
# Hinter dem Doppelpunkt steht jeweils der Standardwert, falls die Variable nicht gesetzt ist.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:maschinenverleih}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Die Tabellen legen WIR selbst per SQL an (schema.sql) - Hibernate darf die DB NICHT implizit erzeugen.
# (Vorgabe aus der Aufgabenstellung: "Software, welche die Datenbank implizit erzeugt, ist nicht zulaessig")
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# Zeigt die ausgefuehrten SQL-Befehle in der Konsole (hilfreich zum Lernen)
spring.jpa.show-sql=true
