spring.application.name=maschinenverleih
server.port=8080

# --- Datenbank: PostgreSQL ---
# Zugangsdaten kommen aus Umgebungsvariablen - niemals Passwoerter ins Repository schreiben!
# Hinter dem Doppelpunkt steht jeweils der Standardwert, falls die Variable nicht gesetzt ist.
# Standard = Server-DB ueber SSH-Tunnel auf localhost:5433, Datenbank "postgres", Schema "maschinenverleih".
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:postgres}?currentSchema=maschinenverleih
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.default_schema=maschinenverleih

# Die Tabellen legen WIR selbst per SQL an (schema.sql) - Hibernate darf die DB NICHT implizit erzeugen.
# (Vorgabe aus der Aufgabenstellung: "Software, welche die Datenbank implizit erzeugt, ist nicht zulaessig")
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# Datenbankzugriffe nur innerhalb der Services, nicht erst beim Erzeugen der JSON-Antwort
spring.jpa.open-in-view=false

# Zeigt die ausgefuehrten SQL-Befehle in der Konsole (hilfreich zum Lernen)
spring.jpa.show-sql=true

# --- Swagger / OpenAPI ---
# Oberflaeche: http://localhost:8080/swagger-ui.html   Beschreibung als JSON: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Excel-Import
spring.servlet.multipart.max-file-size=5MB

# Weboberflaeche (Thymeleaf): deutsche Datums- und Zahlenformate, Wochentage auf Deutsch
spring.web.locale=de_DE
spring.web.locale-resolver=fixed
# Sitzung nur per Cookie, keine ";jsessionid=..." in der Adresszeile
server.servlet.session.tracking-modes=cookie
